apiVersion: apps/v1
kind: Deployment
metadata:
  name: fsuvius
  namespace: cosi
  labels:
    app: fsuvius
spec:
  replicas: 1
  selector:
    matchLabels:
      app: fsuvius
  template:
    metadata:
      labels:
        app: fsuvius
    spec:
      containers:
        - name: fsuvius
          image: registry.cosi.clarkson.edu/cosi-meta/fsuvius
          ports:
            - containerPort: 8080
          #CONECT TO THE POD HERE PT 1
          volumeMounts:
            - name: data
              mountPath: /home/fsuvius/fsuvius/data
          #^^^
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
    #CONECT TO THE POD HERE PT 2
    volumes:
      - name: data
        persistentVolumeClaim:
          claimName: fsuvius-data # use name from PersistentVolumeClaim
    #^^^
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
    name: fsuvius-data #Kabab case, USE FOR PART 2!
    namespace: cosi
spec:
    accessModes:
    - ReadWriteMany #INFANET EDITS
    storageClassName: longhorn #burg
    resources:
        requests:
            storage: 2Gi
---
apiVersion: v1
kind: Service
metadata:
  name: fsuvius
  namespace: cosi
spec:
  selector: {app: fsuvius}
  ports:
    - port: 80
      targetPort: 8080 #The port you are using for the containerPort.
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fsuvius-tls
  namespace: cosi
spec:
  entryPoints:
    - websecure
  routes:
    - kind: Rule
      match: Host(`fsuvius2.cosi.clarkson.edu`)
      services:
        - name: fsuvius
          port: 80
  tls:
    certResolver: le
---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: fsuvius-redirect
  namespace: cosi
spec:
  entryPoints:
    - web
  routes:
  - match: Host(`fsuvius2.cosi.clarkson.edu`)
    kind: Rule
    middlewares:
    - name: https-redirect
      namespace: cosi
    services: # stupid ass bullshit
        - name: noop@internal
          kind: TraefikService