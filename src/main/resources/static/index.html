<!DOCTYPE html>
<html>
    <head>
        <title>Mount Fsuvius</title>
        <link rel="stylesheet" href="style.css">
        <link rel="stylesheet" href="fx.css">
    </head>

    <body>
        <noscript><h1>You need to enable Javascript to use Mount Fsuvius!</h1></noscript>

        <div class="content_container">
            <div style="display: flex;">
                <img class="logo" src="media/logo.png" alt="Mount Fsuvius">
                <textarea id="NEWS" oninput="storeNews()"></textarea>
            </div>
            <p><i>The Sierra Mist Edition</i></p>

            <div class="spacer"></div>

            <div id="USER_LIST"></div>

            <div class="spacer"></div>

            <input class="name_field" id="CREATE_FIELD" placeholder="new user's name...">
            <button onclick="handle_create()">Create User</button>
            <button onclick="display_list(refresh=true)">Refresh List</button>
            <button id="SHOW_HIDDEN" onclick="toggleInactiveUsers()">Show Hidden Users</button>
            <button onclick="location.href='/about.html'" type="button">
         About</button>
        </div>

        <div id="TOAST_MESSAGE"></div>
    </body>

    <script src="toast.js"></script>
    <script src="index.js"></script>
</html>
